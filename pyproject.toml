[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemlab"
version = "1.0.0"
description = "Virtual Chemistry Laboratory with Webcam Hand Tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.8",
    "mediapipe>=1.0",
    "numpy>=2.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=24.0",
    "ruff>=0.1.0",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests with mock dependencies",
    "integration: Integration tests exercising decoupled pipelines",
    "audit: AST and code quality anti-ai-slop audits",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG001", "S101", "F401", "F841", "B007", "PTH", "UP035"]
"scripts/*" = ["PLR2004", "ARG001", "F841", "B007", "B905", "PTH", "E402", "E741"]
"blender_live_bridge.py" = ["PLW0603"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true